<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety APP</title>
</head>
<body style="margin:0; font-family:sans-serif; text-align:center; padding-top:40px; background-color:#FFF9EE;">
<div id="app-frame-wrap" style="width:100%;height:100vh;">
  <!-- UI แสดงสถานะตอนโหลด -->
  <h3 style="color:#FF7043;">กำลังพาไปยังแอพ...</h3>
  <p style="color:#666; font-size:14px;">กรุณารอสักครู่</p>
  
  <!-- ปุ่มสำรอง จะโผล่มาถ้าโหลดนานเกินไป -->
  <p id="fallback-container" style="display:none; margin-top:30px;">
     <a id="fallback-link" href="#" style="padding:12px 24px; background:#42A5F5; color:#fff; text-decoration:none; border-radius:10px; font-weight:bold;">กดที่นี่เพื่อเปิดแอพ</a>
  </p>
</div>

<script>
  // ⚠️ วางลิงก์ Web App (Google Apps Script) ของคุณตรงนี้ (ต้องลงท้ายด้วย /exec)
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxF9SrY6V2wFMfULs0Myc9-7AYV5ywXR1XP130bCPEFJBjYxTlytQRRJE9h0nGDGjUN_A/exec';

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var wrap = document.getElementById('app-frame-wrap');
  var fallbackContainer = document.getElementById('fallback-container');
  var fallbackLink = document.getElementById('fallback-link');

  if (params.get('redirect') === '1' && id) {
    // 1. เตรียมลิงก์สำรอง (ลิงก์ตรงไปยัง Apps Script เผื่อ Github ดึงข้อมูลไม่สำเร็จ)
    var directUrl = EXEC_URL + '?id=' + encodeURIComponent(id) + '&redirect=1';
    fallbackLink.href = directUrl;

    // 2. ตั้งเวลาไว้ 2.5 วินาที ถ้า Fetch ค้าง ให้บังคับเปลี่ยนหน้าและโชว์ปุ่มทันที
    var timeoutId = setTimeout(function() {
      fallbackContainer.style.display = 'block';
      window.location.replace(directUrl);
    }, 2500);

    // 3. พยายามดึงลิงก์ปลายทางแบบเงียบๆ
    fetch(EXEC_URL + '?id=' + encodeURIComponent(id) + '&redirect=1&format=json')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        clearTimeout(timeoutId); // ยกเลิกการตั้งเวลา
        if (data && data.link) {
          window.location.replace(data.link);
        } else {
          wrap.innerHTML = '<h2 style="padding-top:40px; color:#EF5350;">❌ ไม่พบแอพนี้ หรือถูกลบไปแล้ว</h2>';
        }
      })
      .catch(function (error) {
        // หาก Fetch โดนบล็อก ให้เปลี่ยนหน้าด้วยวิธีตรงๆ
        clearTimeout(timeoutId);
        window.location.replace(directUrl);
      });
  } else {
    // กรณีไม่ได้มาจากการสแกน QR ให้โหลด Dashboard มาแสดง
    wrap.innerHTML = '';
    var iframe = document.createElement('iframe');
    iframe.style.width = '100%';
    iframe.style.height = '100vh';
    iframe.style.border = '0';
    iframe.setAttribute('scrolling', 'yes');
    iframe.src = EXEC_URL;
    wrap.appendChild(iframe);
  }
</script>
</body>
</html>
