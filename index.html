<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety APP</title>
</head>
<body style="margin:0;">
<div id="app-frame-wrap" style="width:100%;height:100vh;"></div>
<script>
  // 🔧 ต้องเป็นลิงก์ /exec ของ Apps Script ตัวจริงเสมอ
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxF9SrY6V2wFMfULs0Myc9-7AYV5ywXR1XP130bCPEFJBjYxTlytQRRJE9h0nGDGjUN_A/exec';

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var wrap = document.getElementById('app-frame-wrap');

  if (params.get('redirect') === '1' && id) {
    // ===== มาจากการสแกน QR Code =====
    wrap.innerHTML = '<p style="font-family:sans-serif;text-align:center;padding-top:40px;">กำลังเปิดแอพ...</p>';

    fetch(EXEC_URL + '?id=' + encodeURIComponent(id) + '&redirect=1&format=json')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.link) {
          window.location.replace(data.link);
        } else {
          wrap.innerHTML = '<h2 style="font-family:sans-serif;text-align:center;padding-top:40px;">❌ ไม่พบแอพนี้ หรือถูกลบไปแล้ว</h2>';
        }
      })
      .catch(function () {
        // fetch ใช้ไม่ได้ -> fallback กลับไปวิธีเดิมผ่านหน้า Apps Script
        window.location.replace(EXEC_URL + window.location.search);
      });
  } else {
    // ===== เข้าหน้าแรกปกติ: แสดง dashboard ทั้งหมดผ่าน iframe =====
    var iframe = document.createElement('iframe');
    iframe.style.width = '100%';
    iframe.style.height = '100vh';
    iframe.style.border = '0';
    iframe.setAttribute('scrolling', 'yes');
    iframe.setAttribute('frameborder', '0');
    iframe.src = EXEC_URL;
    wrap.appendChild(iframe);
  }
</script>
</body>
</html>
